name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events but only for the main branch
  pull_request:
    branches: [main, v1]

  push:
    branches: [main, v1]

  merge_group:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Negation pattern — any path not in the safelist defaults to heavy,
  # so a newly added folder fails safe into running the full matrix.
  changes:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute path filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # `every` so negation patterns actually exclude; default `some` OR's
          # all patterns, which makes `**` swallow every file.
          predicate-quantifier: 'every'
          filters: |
            heavy:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!CONTRIBUTING'
              - '!website/**'
              - '!.github/renovate.json5'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/DISCUSSION_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'
              - '!.github/CODEOWNERS'
              - '!.vscode/**'
              - '!.cursor/**'
              - '!.claude/**'
              - '!.gitignore'
              - '!.editorconfig'

  lint-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 10

      - name: Install Pnpm
        run: |
          npm install -g corepack@latest --force
          corepack enable

      - name: Setup Node.js 22.x
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Lint / Type Check / Check Dependency Version
        run: |
          pnpm lint
          pnpm check
          pnpm check-dependency-version
  # ======== test ========
  test-build:
    # Only gated by the path filter — lint-check runs in parallel and is
    # still enforced via the ci-passed aggregator.
    needs: [changes]
    # Non-PR events (push to main/v1, merge_group, workflow_dispatch)
    # always run heavy as a post-merge safety net; PR events go through
    # the `changes` path filter.
    if: github.event_name != 'pull_request' || needs.changes.outputs.heavy == 'true'
    # One job per OS instead of a full node × OS product; Node 22 (oldest
    # active LTS we target) on Linux, Node 26 smoke-tests the other platforms.
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.x
          - os: macos-latest
            node-version: 26.x
          - os: windows-latest
            node-version: 26.x
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 10

      - name: Install Pnpm
        run: |
          npm install -g corepack@latest --force
          corepack enable

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile

      # No Playwright browser install/cache: e2e runs on the runner's
      # pre-installed Chrome via `channel: 'chrome'` (e2e/playwright.config.ts).

      # `pnpm dedupe --check` still find duplications after run `pnpm dedupe`
      # - name: Check pnpm Dedupe
      #   run: pnpm dedupe --check

      - name: Build sandboxes storybooks
        run: |
          pnpm run build:sandboxes

      - name: Test
        run: |
          pnpm test

      - name: Build test packages
        run: |
          pnpm build:test

      - name: E2E
        run: |
          pnpm e2e

  # Aggregator status for branch protection.
  # Always runs, passes iff every dependent job either succeeded or was
  # legitimately skipped by the `changes` filter. Point branch protection
  # at this job instead of individual matrix checks.
  ci-passed:
    needs: [changes, lint-check, test-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert no failures
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint-check.result }}
          TEST: ${{ needs.test-build.result }}
        run: |
          [[ "$CHANGES" == "success" ]] || { echo "changes: $CHANGES"; exit 1; }
          [[ "$LINT" == "success" ]] || { echo "lint-check: $LINT"; exit 1; }
          [[ "$TEST" == "success" || "$TEST" == "skipped" ]] || { echo "test-build: $TEST"; exit 1; }
