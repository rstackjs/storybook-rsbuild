# .github/workflows/release.yml

name: Release

permissions:
  id-token: write # Required for OIDC
  contents: write

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        type: choice
        description: 'npm dist-tag'
        required: true
        default: latest
        options:
          - alpha
          - beta
          - rc
          - canary
          - latest

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Update npm to the latest version to enable OIDC
      # Use corepack to install pnpm
      - name: Setup Package Managers
        run: |
          npm install -g npm@latest
          npm --version
          npm install -g corepack@latest --force
          corepack enable

      - name: Install Dependencies and build
        run: pnpm install --frozen-lockfile

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: version_to_release
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const packageJson = JSON.parse(fs.readFileSync('./packages/builder-rsbuild/package.json', 'utf8'));
            return 'v' + packageJson.version;

      - name: Validate npm tag
        run: |
          VERSION=$(node -p "require('./packages/builder-rsbuild/package.json').version")
          if [[ "$VERSION" == *-* && "${{ inputs.npm_tag }}" == "latest" ]]; then
            echo "::error::Prerelease $VERSION must use a non-latest npm_tag (e.g. beta)."
            exit 1
          fi
          if [[ "$VERSION" != *-* && "${{ inputs.npm_tag }}" != "latest" ]]; then
            echo "::error::Stable $VERSION must use npm_tag=latest."
            exit 1
          fi

      - name: Publish to NPM
        run: |
          git tag ${{ steps.version_to_release.outputs.result }}
          git push origin ${{ steps.version_to_release.outputs.result }}
          pnpm -r publish --tag ${{ inputs.npm_tag }} --no-git-checks

      - name: GitHub Release
        run: pnpx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
